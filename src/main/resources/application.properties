# Persistence backend (file | memory | postgres)
storage.backend=file

# base folder (for multi-file mode)
storage.basePath=.
storage.travellersFile=data/travellers.json
storage.popularCitiesFile=data/popular_cities.json
storage.helpFile=docs/help.txt

# PostgreSQL connection
storage.db.url=jdbc:postgresql://localhost:5433/travelguide?currentSchema=travelguide
storage.db.user=traveluser
storage.db.password=secret
