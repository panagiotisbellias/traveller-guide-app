name: PR Quality Checks

on:
  pull_request:
    branches:
      - main
      - development
      - task/introduce-branch-protections-and-enforce-pr-reviews-6cp55jMqf3vWJ6rc
  push:
    branches:
      - task/introduce-branch-protections-and-enforce-pr-reviews-6cp55jMqf3vWJ6rc

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & Test
        run: mvn clean verify

      - name: Run static analysis
        run: mvn spotless:check # optional: formatting/lint

  enforce-branch-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR targets protected branch
        run: |
          echo "Branch protection enforced via GitHub settings."
