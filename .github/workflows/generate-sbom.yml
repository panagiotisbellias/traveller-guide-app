name: Generate SBOM
on:
  push:
    branches:
      - main
      - development
      - task/generate-sbom-using-syft-and-commit-6cp55hFQHh55p6pc
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Create SBOM directory
        run: mkdir -p sbom

      - name: Generate SBOMs
        run: |
          syft packages dir:. -o cyclonedx-json > sbom/sbom.json
          syft packages dir:. -o spdx-json > sbom/sbom.spdx.json

      - name: Commit SBOMs to fixed branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git fetch origin task/generate-sbom-using-syft-and-commit-6cp55hFQHh55p6pc || echo "No existing task/generate-sbom-using-syft-and-commit-6cp55hFQHh55p6pc branch yet"
          git checkout -B task/generate-sbom-using-syft-and-commit-6cp55hFQHh55p6pc

          # Only commit if there are changes
          if git diff --quiet sbom/; then
            echo "No SBOM changes detected, skipping commit and PR."
            exit 0
          fi

          git add sbom/
          git commit -m "chore: update SBOMs" || echo "No changes to commit"
          git push --force-with-lease origin task/generate-sbom-using-syft-and-commit-6cp55hFQHh55p6pc

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update SBOMs"
          branch: task/generate-sbom-using-syft-and-commit-6cp55hFQHh55p6pc
          base: development
          title: "Update SBOMs"
          body: |
            This PR updates the CycloneDX and SPDX SBOMs.
          update-existing: true
